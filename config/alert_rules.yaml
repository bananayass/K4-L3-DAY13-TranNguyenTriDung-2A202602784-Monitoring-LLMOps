alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(response_sent.latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602784
    runbook: docs/alerts.md#highlatencyp95
  - name: HighErrorRate
    severity: critical
    condition: request_failed / request_received > 2%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602784
    runbook: docs/alerts.md#higherrorrate
  - name: LowRetrievalSuccess
    severity: warning
    condition: retrieval tool_success rate < 90%
    duration: 10m
    type: symptom-based
    channel: slack
    owner: student-2A202602784
    runbook: docs/alerts.md#lowretrievalsuccess
